<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Aportes{% endblock %} — Escrituração</title>
<style>
  :root {
    --tinta: #1a1d23; --suave: #5b6472; --linha: #dde1e7;
    --fundo: #f6f7f9; --papel: #ffffff;
    --ok: #0f7b4f; --ok-fundo: #e8f5ee;
    --atencao: #8a5a00; --atencao-fundo: #fdf3e0;
    --parada: #a3282f; --parada-fundo: #fdecec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    font: 16px/1.55 "Segoe UI", system-ui, sans-serif;
    color: var(--tinta); background: var(--fundo);
  }
  main { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 1.75rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  h2 { font-size: 1.1rem; margin: 2rem 0 .75rem; }
  .sub { color: var(--suave); font-size: .9rem; margin: 0; }
  .cartao {
    background: var(--papel); border: 1px solid var(--linha);
    border-radius: 10px; padding: 1.5rem; margin-bottom: 1.25rem;
  }
  label { display: block; font-weight: 600; font-size: .875rem; margin-bottom: .35rem; }
  .ajuda { font-weight: 400; color: var(--suave); }
  input, select {
    width: 100%; padding: .55rem .7rem; font: inherit;
    border: 1px solid var(--linha); border-radius: 6px; background: var(--papel);
  }
  input:focus, select:focus { outline: 2px solid #3b6ea5; outline-offset: 1px; }
  .campo { margin-bottom: 1.1rem; }
  .dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  button {
    font: inherit; font-weight: 600; padding: .7rem 1.4rem;
    background: var(--tinta); color: #fff; border: 0; border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #000; }
  a { color: #2a5d99; }
  .aviso { border-left: 4px solid; padding: .9rem 1.1rem; border-radius: 6px; margin-bottom: 1.25rem; }
  .aviso p { margin: .35rem 0; }
  .aviso :first-child { margin-top: 0; }
  .aviso :last-child { margin-bottom: 0; }
  .ok { border-color: var(--ok); background: var(--ok-fundo); }
  .atencao { border-color: var(--atencao); background: var(--atencao-fundo); }
  .parada { border-color: var(--parada); background: var(--parada-fundo); }
  .rotulo { font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: .75rem; }
  ul { margin: .5rem 0; padding-left: 1.2rem; }
  code { background: #eef0f3; padding: .1rem .35rem; border-radius: 4px; font-size: .875em; }
  .rodape { color: var(--suave); font-size: .8rem; margin-top: 2.5rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  td { padding: .4rem 0; border-bottom: 1px solid var(--linha); vertical-align: top; }
  td:first-child { color: var(--suave); width: 40%; }
</style>
</head>
<body>
<main>
  <header>
    <h1>{% block cabecalho %}Aportes{% endblock %}</h1>
    <p class="sub">{% block subtitulo %}{% endblock %}</p>
  </header>
  {% block conteudo %}{% endblock %}
  <p class="rodape">
    Escrituração — assistente de aportes. Os documentos gerados ficam na pasta
    de saída; a aprovação no Portal ID continua manual.
  </p>
</main>
</body>
</html>
